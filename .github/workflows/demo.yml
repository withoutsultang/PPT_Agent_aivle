name: Generate lecture demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice-impress poppler-utils fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - name: Generate and verify the public sample
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path
          from pipeline import run_pipeline

          from base64 import b64decode

          sample = Path("docs/demo/health-check.pptx").read_bytes()
          Path("health-check.pptx").write_bytes(sample if sample.startswith(b"PK") else b64decode(sample, validate=True))
          result = run_pipeline("health-check.pptx", target_duration_sec=25)
          if result["total_slides"] != 3 or len(result["video_paths"]) != 3:
              raise RuntimeError("Expected three rendered slides")
          if len(result.get("quiz_set", [])) != 6:
              raise RuntimeError("Expected six validated quiz questions")

          output = Path("demo-artifact")
          output.mkdir()
          shutil.copy2(result["final_video"], output / "lecture.mp4")
          shutil.copy2(Path(result["work_dir"]) / "result.json", output)
          (output / "quiz.json").write_text(
              json.dumps(result["quiz_set"], ensure_ascii=False, indent=2), encoding="utf-8"
          )
          scripts = sorted((Path(result["work_dir"]) / "scripts").glob("slide-*.txt"))
          if len(scripts) != 3:
              raise RuntimeError("Expected three generated scripts")
          for script in scripts:
              shutil.copy2(script, output)

          def duration(path):
              return float(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "default=nw=1:nk=1", str(path)
              ], text=True))

          start = max(0, duration(result["video_paths"][0]) - 8)
          subprocess.run([
              "ffmpeg", "-v", "error", "-ss", str(start), "-i", str(output / "lecture.mp4"),
              "-t", "25", "-map", "0:v:0", "-map", "0:a:0", "-c:v", "libx264",
              "-c:a", "aac", "-movflags", "+faststart", str(output / "transition.mp4")
          ], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-demo
          path: demo-artifact/
          if-no-files-found: error
