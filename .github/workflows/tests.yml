name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice-impress poppler-utils fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py agent_nodes.py pipeline.py prompts.py utils.py
      - run: python -m pytest -q
